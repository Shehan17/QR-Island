name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html .nojekyll css js assets vendor _site/

      # Browsers may keep CSS and JS for a while. Giving each deploy its own
      # ?v= address stops a new page from loading old styles or scripts.
      - name: Stamp asset versions
        run: |
          version="${GITHUB_SHA::8}"
          sed -i "s/?v=dev/?v=${version}/g" _site/index.html
          grep -q "?v=${version}" _site/index.html
          if grep -q "?v=dev" _site/index.html; then exit 1; fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
